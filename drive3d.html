  const hole=new T.Path();
  INN.forEach((p,i)=>{const v=V(p); i?hole.lineTo(v.x,v.z):hole.moveTo(v.x,v.z);});
  shape.holes.push(hole);
  const g=new T.ShapeGeometry(shape); g.rotateX(Math.PI/2);
  const m=new T.MeshStandardMaterial({color:0x303339,roughness:0.95,metalness:0.0,side:T.DoubleSide});
  return new T.Mesh(g,m);
}
scene.add(roadMesh());
// edge lines (white)
function edgeLine(arr,col,yoff){
  const pts=arr.map(p=>{const v=V(p);v.y+=yoff;return v;}); pts.push(pts[0].clone());
  const g=new T.BufferGeometry().setFromPoints(pts);
  return new T.Line(g,new T.LineBasicMaterial({color:col}));
}
scene.add(edgeLine(OUT,0x5a5f66,0.05)); scene.add(edgeLine(INN,0x5a5f66,0.05));

// ---- kerbs: red/white dashes where edge curvature high ----
function curvature(arr){
  const n=arr.length,k=new Array(n).fill(0);
  for(let i=0;i<n;i++){const a=V(arr[(i-2+n)%n]),b=V(arr[i]),c=V(arr[(i+2)%n]);
    const u=new T.Vector3().subVectors(b,a), w=new T.Vector3().subVectors(c,b);
    u.y=0;w.y=0; const ang=u.angleTo(w); k[i]=ang;}
  return k;
}
function kerbs(arr,side){
  const n=arr.length,k=curvature(arr),grp=new T.Group();
  for(let i=0;i<n;i++){ if(k[i]>0.045){
    const a=V(arr[i]),b=V(arr[(i+1)%n]); const col=(i%2===0)?0xe23b3b:0xf2f2f2;
    const len=a.distanceTo(b)||1; const geo=new T.BoxGeometry(0.5,0.08,len);
    const m=new T.Mesh(geo,new T.MeshStandardMaterial({color:col,roughness:0.8}));
    m.position.copy(a.clone().lerp(b,0.5)); m.position.y+=0.06;
    m.lookAt(b.x,m.position.y,b.z); grp.add(m);
  }}
  return grp;
}
scene.add(kerbs(OUT)); scene.add(kerbs(INN));

// ---- racing line tube colored by speed ----
function turbo(t){ // t 0..1
  t=Math.max(0,Math.min(1,t));
  const r=Math.max(0,Math.min(1, 1.6-Math.abs(t-0.75)*3.2));
  const g=Math.max(0,Math.min(1, 1.3-Math.abs(t-0.5)*2.8));
  const b=Math.max(0,Math.min(1, 1.5-Math.abs(t-0.25)*3.2));
  return new T.Color(r,g,b);
}
function speedTube(points,vals,radius){
  const curve=new T.CatmullRomCurve3(points,true,'catmullrom',0.3);
  const seg=Math.min(1400,points.length);
  const geo=new T.TubeGeometry(curve,seg,radius,8,true);
  const vmin=Math.min(...vals),vmax=Math.max(...vals);
  const colAttr=[];
  const pos=geo.attributes.position;
  const ring=9; // radial+1
  for(let i=0;i<pos.count;i++){
    const u=Math.floor(i/ring)/(seg); // 0..1 along
    const vi=Math.min(vals.length-1,Math.round(u*(vals.length-1)));
    const c=turbo((vals[vi]-vmin)/(vmax-vmin));
    colAttr.push(c.r,c.g,c.b);
  }
  geo.setAttribute('color',new T.Float32BufferAttribute(colAttr,3));
  const m=new T.MeshStandardMaterial({vertexColors:true,roughness:0.5,emissive:0x111111});
  return new T.Mesh(geo,m);
}
scene.add(speedTube(EP,EV,0.5));

// ---- AC ideal line (toggle) ----
const idealPts=IDEAL.map(p=>new T.Vector3(p[0]-cx,0.12,p[2]-cz));
const idealCurve=new T.CatmullRomCurve3(idealPts,true,'catmullrom',0.3);
const idealMesh=new T.Mesh(new T.TubeGeometry(idealCurve,900,0.28,6,true),
  new T.MeshStandardMaterial({color:0x2f9bf0,emissive:0x0a2740,roughness:0.4}));
idealMesh.visible=false; scene.add(idealMesh);

// ---- car (simple MX5-ish) ----
const car=new T.Group();
const body=new T.Mesh(new T.BoxGeometry(1.7,0.55,4.0),new T.MeshStandardMaterial({color:0xc2181f,roughness:0.4,metalness:0.3}));
body.position.y=0.55; car.add(body);
const cabin=new T.Mesh(new T.BoxGeometry(1.5,0.5,1.7),new T.MeshStandardMaterial({color:0x151515,roughness:0.3}));
cabin.position.set(0,0.95,-0.2); car.add(cabin);
const wheelG=new T.CylinderGeometry(0.34,0.34,0.26,16); const wheelM=new T.MeshStandardMaterial({color:0x0c0c0c,roughness:0.8});
[[0.9,-1.3],[-0.9,-1.3],[0.9,1.3],[-0.9,1.3]].forEach(([x,z])=>{const w=new T.Mesh(wheelG,wheelM);w.rotation.z=Math.PI/2;w.position.set(x,0.34,z);car.add(w);});
scene.add(car);

// ---- smoothed camera anchor line (so car visibly weaves) ----
function smooth(arr,w){const n=arr.length,out=[];for(let i=0;i<n;i++){let x=0,y=0,z=0,c=0;for(let j=-w;j<=w;j++){const p=arr[(i+j+n)%n];x+=p.x;y+=p.y;z+=p.z;c++;}out.push(new T.Vector3(x/c,y/c,z/c));}return out;}
const CA=smooth(EP,26);

// helpers to sample by index fraction
function atIdx(arr,f){const n=arr.length;const i=Math.floor(f);const t=f-i;const a=arr[i%n],b=arr[(i+1)%n];return a.clone().lerp(b,t);}
function fwdIdx(arr,f){const n=arr.length;const i=Math.floor(f)%n;const a=arr[i],b=arr[(i+1)%n];return new T.Vector3(b.x-a.x,b.y-a.y,b.z-a.z).normalize();}

// ---- playback state ----
let play=true,speed=1,tcur=0;
const CAMS={chase:{back:9.5,h:4.2,ahead:16,lookH:1.0},low:{back:4.5,h:1.7,ahead:24,lookH:1.3},heli:{back:1.5,h:120,ahead:1.5,lookH:0}};
let camMode='chase'; let camPrev=new T.Vector3(0,30,0);
// map time -> eric index fraction
function idxAtT(t){ // binary search ET
  let lo=0,hi=ET.length-1; if(t<=ET[0])return 0; if(t>=ET[hi])return hi;
  while(lo<hi){const m=(lo+hi)>>1; if(ET[m]<t)lo=m+1; else hi=m;}
  const i=Math.max(1,lo); const f=(t-ET[i-1])/Math.max(1e-6,ET[i]-ET[i-1]); return (i-1)+f;
}

const clk=document.getElementById('clk'),spd=document.getElementById('spd'),
  thrI=document.querySelector('#thr i'),brkI=document.querySelector('#brk i'),
  thrv=document.getElementById('thrv'),brkv=document.getElementById('brkv'),
  cor=document.getElementById('cor'),pct=document.getElementById('pct'),scrub=document.getElementById('scrub');
function fmt(t){const m=Math.floor(t/60),s=(t%60);return m+':'+(s<10?'0':'')+s.toFixed(2);}

// minimap
const mm=document.getElementById('mini'),mx=mm.getContext('2d');
let MMB=null;
function miniInit(){mm.width=210*2;mm.height=120*2;mx.scale(2,2);
  let xs=EP.map(p=>p.x),zs=EP.map(p=>p.z);
  const x0=Math.min(...xs),x1=Math.max(...xs),z0=Math.min(...zs),z1=Math.max(...zs);
  const pad=12,W=210-pad*2,H=120-pad*2,sc=Math.min(W/(x1-x0),H/(z1-z0));
  MMB={x0,z0,sc,ox:pad+(W-(x1-x0)*sc)/2,oz:pad+(H-(z1-z0)*sc)/2};
}
function mmPt(p){return [MMB.ox+(p.x-MMB.x0)*MMB.sc, MMB.oz+(p.z-MMB.z0)*MMB.sc];}
function drawMini(ci){mx.clearRect(0,0,210,120);
  mx.lineWidth=2.2;mx.strokeStyle='#3a3f47';mx.beginPath();
  for(let i=0;i<EP.length;i+=3){const[a,b]=mmPt(EP[i]);i===0?mx.moveTo(a,b):mx.lineTo(a,b);}mx.stroke();
  const[a,b]=mmPt(EP[ci%EP.length]);mx.fillStyle='#e5484d';mx.beginPath();mx.arc(a,b,4,0,7);mx.fill();
}
miniInit();

function frame(ms){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(frame._l?(ms-frame._l):16)/1000); frame._l=ms;
  if(play){ tcur+=dt*speed; if(tcur>TT)tcur=0; }
  const f=idxAtT(tcur); const ci=Math.round(f)%EP.length;
  const P=atIdx(EP,f), Fw=fwdIdx(EP,f);
  car.position.copy(P); car.position.y=0; car.rotation.y=Math.atan2(Fw.x,Fw.z);
  // camera anchored to smoothed line
  const Pc=atIdx(CA,f), Fc=fwdIdx(CA,f), cf=CAMS[camMode];
  const tgt=new T.Vector3(Pc.x-Fc.x*cf.back, Pc.y+cf.h, Pc.z-Fc.z*cf.back);
  camPrev.lerp(tgt,0.12); cam.position.copy(camPrev);
  cam.lookAt(P.x+Fc.x*cf.ahead, P.y+cf.lookH, P.z+Fc.z*cf.ahead);
  // HUD
  const vv=EV[ci]|0, th=ETH[ci]|0, br=EBR[ci]|0;
  clk.textContent=fmt(tcur); spd.textContent=vv;
  thrI.style.width=th+'%'; brkI.style.width=br+'%'; thrv.textContent=th+'%'; brkv.textContent=br+'%';
  const pc=Math.round(tcur/TT*100); pct.textContent=pc+'%';
  if(!scrub._drag)scrub.value=Math.round(tcur/TT*1000);
  // corner label by progress (approx 23 corners)
  drawMini(ci);
  renderer.render(scene,cam);
}
requestAnimationFrame(frame);

// controls
document.getElementById('play').onclick=function(){play=!play;this.textContent=play?'⏸ 暫停':'▶ 播放';};
document.getElementById('speed').onclick=function(){speed=speed===1?2:(speed===2?0.5:1);this.textContent=speed+'x';};
scrub.addEventListener('input',e=>{scrub._drag=true;tcur=e.target.value/1000*TT;});
scrub.addEventListener('change',()=>{scrub._drag=false;});
document.querySelectorAll('#cams [data-cam]').forEach(b=>b.onclick=()=>{
  camMode=b.dataset.cam;document.querySelectorAll('#cams [data-cam]').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
document.getElementById('ideal').onclick=function(){idealMesh.visible=!idealMesh.visible;this.classList.toggle('on',idealMesh.visible);};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
})();
</script>
</body>
