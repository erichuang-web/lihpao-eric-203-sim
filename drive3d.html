function kerbStrip(rail){
  const grp=new T.Group();
  for(let i=0;i<N;i++){ if(KB[i]){
    const a=rail[i],b=rail[(i+1)%N]; const col=(i%2===0)?0xe23b3b:0xf2f2f2;
    const len=a.distanceTo(b)||1; const m=new T.Mesh(new T.BoxGeometry(1.2,0.12,len),new T.MeshStandardMaterial({color:col,roughness:0.8}));
    m.position.copy(a.clone().lerp(b,0.5)); m.position.y+=0.06; m.lookAt(b.x,m.position.y,b.z); grp.add(m);
  }}
  return grp;
}
scene.add(kerbStrip(Lv)); scene.add(kerbStrip(Rv));
// ---------- 圍牆 walls (紅白) along both rails, offset outward ----------
function wall(rail,isInner,off,h){
  const grp=new T.Group();
  for(let i=0;i<N;i++){
    const o=outward(i), s=isInner?-1:1;
    const a=rail[i], b=rail[(i+1)%N];
    const oa=new T.Vector3(a.x+o.x*off*s,a.y,a.z+o.z*off*s), ob=new T.Vector3(b.x+o.x*off*s,b.y,b.z+o.z*off*s);
    const len=oa.distanceTo(ob)||1; const col=(Math.floor(i/2)%2===0)?0xd83a3a:0xf4f4f4;
    const m=new T.Mesh(new T.BoxGeometry(0.28,h,len),new T.MeshStandardMaterial({color:col,roughness:0.85}));
    m.position.set((oa.x+ob.x)/2,(oa.y+ob.y)/2+h/2,(oa.z+ob.z)/2); m.lookAt(ob.x,m.position.y,ob.z); grp.add(m);
  }
  return grp;
}
scene.add(wall(Lv,false,15,1.1)); scene.add(wall(Rv,true,15,1.1));
// ---------- 藍色香腸 blue sausage kerbs at sharp apexes (infield side of inner rail) ----------
(function(){
  const grp=new T.Group();
  for(let i=0;i<N;i++){ if(KB[i]){
    const o=outward(i), a=Rv[i], b=Rv[(i+1)%N];
    const ca=new T.Vector3(a.x-o.x*1.0,a.y,a.z-o.z*1.0), cb=new T.Vector3(b.x-o.x*1.0,b.y,b.z-o.z*1.0);
    const len=ca.distanceTo(cb)*1.05||1;
    const m=new T.Mesh(new T.BoxGeometry(0.85,0.22,len),new T.MeshStandardMaterial({color:0x2f6fe0,roughness:0.5,metalness:0.1}));
    m.position.copy(ca.clone().lerp(cb,0.5)); m.position.y+=0.12; m.lookAt(cb.x,m.position.y,cb.z); grp.add(m);
  }}
  scene.add(grp);
})();

// ---------- racing line (speed tube) ----------
function turbo(t){t=Math.max(0,Math.min(1,t));const r=Math.max(0,Math.min(1,1.6-Math.abs(t-0.75)*3.2));const g=Math.max(0,Math.min(1,1.3-Math.abs(t-0.5)*2.8));const b=Math.max(0,Math.min(1,1.5-Math.abs(t-0.25)*3.2));return new T.Color(r,g,b);}
function speedTube(points,vals,radius){
  const curve=new T.CatmullRomCurve3(points,true,'catmullrom',0.25);
  const seg=Math.min(1400,points.length); const geo=new T.TubeGeometry(curve,seg,radius,8,true);
  const vmin=Math.min(...vals),vmax=Math.max(...vals),ring=9,col=[];
  for(let i=0;i<geo.attributes.position.count;i++){const u=Math.floor(i/ring)/seg;const vi=Math.min(vals.length-1,Math.round(u*(vals.length-1)));const c=turbo((vals[vi]-vmin)/(vmax-vmin));col.push(c.r,c.g,c.b);}
  geo.setAttribute('color',new T.Float32BufferAttribute(col,3));
  return new T.Mesh(geo,new T.MeshStandardMaterial({vertexColors:true,roughness:0.45,emissive:0x0a0a0a}));
}
scene.add(speedTube(EP,EV,0.55));
// AC ideal line (toggle)
const idPts=IDEAL.map(p=>new T.Vector3(p[0]-cx,p[1]+0.18,p[2]-cz));
const idMesh=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(idPts,true,'catmullrom',0.25),900,0.3,6,true),new T.MeshStandardMaterial({color:0x2f9bf0,emissive:0x0a2740,roughness:0.4}));
idMesh.visible=false; scene.add(idMesh);

// ---------- car ----------
const car=new T.Group();
const body=new T.Mesh(new T.BoxGeometry(1.75,0.5,4.1),new T.MeshStandardMaterial({color:0xc2181f,roughness:0.35,metalness:0.35}));body.position.y=0.55;car.add(body);
const cabin=new T.Mesh(new T.BoxGeometry(1.55,0.5,1.8),new T.MeshStandardMaterial({color:0x111,roughness:0.25}));cabin.position.set(0,0.98,-0.25);car.add(cabin);
const wG=new T.CylinderGeometry(0.35,0.35,0.28,16),wM=new T.MeshStandardMaterial({color:0x0b0b0b,roughness:0.85});
[[0.92,-1.35],[-0.92,-1.35],[0.92,1.35],[-0.92,1.35]].forEach(([x,z])=>{const w=new T.Mesh(wG,wM);w.rotation.z=Math.PI/2;w.position.set(x,0.35,z);car.add(w);});
scene.add(car);

// camera anchor = smoothed eric line
function smooth(a,w){const n=a.length,o=[];for(let i=0;i<n;i++){let x=0,y=0,z=0,c=0;for(let j=-w;j<=w;j++){const p=a[(i+j+n)%n];x+=p.x;y+=p.y;z+=p.z;c++;}o.push(new T.Vector3(x/c,y/c,z/c));}return o;}
const CA=smooth(EP,26);
function atIdx(a,f){const n=a.length,i=Math.floor(f),t=f-i;return a[i%n].clone().lerp(a[(i+1)%n],t);}
function fwdIdx(a,f){const n=a.length,i=Math.floor(f)%n;return new T.Vector3(a[(i+1)%n].x-a[i].x,a[(i+1)%n].y-a[i].y,a[(i+1)%n].z-a[i].z).normalize();}

let play=true,speed=1,tcur=0,camMode='chase',camPrev=new T.Vector3(0,80,0);
const CAMS={chase:{back:9.5,h:4.4,ahead:16,lookH:1.2},low:{back:5,h:2,ahead:24,lookH:1.4},heli:{back:2,h:140,ahead:2,lookH:0}};
function idxAtT(t){let lo=0,hi=ET.length-1;if(t<=ET[0])return 0;if(t>=ET[hi])return hi;while(lo<hi){const m=(lo+hi)>>1;if(ET[m]<t)lo=m+1;else hi=m;}const i=Math.max(1,lo);return (i-1)+(t-ET[i-1])/Math.max(1e-6,ET[i]-ET[i-1]);}

const clk=document.getElementById('clk'),spd=document.getElementById('spd'),thrI=document.querySelector('#thr i'),brkI=document.querySelector('#brk i'),thrv=document.getElementById('thrv'),brkv=document.getElementById('brkv'),pct=document.getElementById('pct'),scrub=document.getElementById('scrub');
function fmt(t){const m=Math.floor(t/60),s=t%60;return m+':'+(s<10?'0':'')+s.toFixed(2);}
const mm=document.getElementById('mini'),mx=mm.getContext('2d');let MMB;
(function(){mm.width=420;mm.height=240;mx.scale(2,2);const xs=EP.map(p=>p.x),zs=EP.map(p=>p.z);const x0=Math.min(...xs),x1=Math.max(...xs),z0=Math.min(...zs),z1=Math.max(...zs);const pad=12,W=210-pad*2,H=120-pad*2,sc=Math.min(W/(x1-x0),H/(z1-z0));MMB={x0,z0,sc,ox:pad+(W-(x1-x0)*sc)/2,oz:pad+(H-(z1-z0)*sc)/2};})();
function mmPt(p){return [MMB.ox+(p.x-MMB.x0)*MMB.sc,MMB.oz+(p.z-MMB.z0)*MMB.sc];}
function drawMini(ci){mx.clearRect(0,0,210,120);mx.lineWidth=2.4;mx.strokeStyle='#5b6470';mx.beginPath();for(let i=0;i<EP.length;i+=3){const[a,b]=mmPt(EP[i]);i===0?mx.moveTo(a,b):mx.lineTo(a,b);}mx.stroke();const[a,b]=mmPt(EP[ci%EP.length]);mx.fillStyle='#e5484d';mx.beginPath();mx.arc(a,b,4,0,7);mx.fill();}

function frame(ms){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(frame._l?(ms-frame._l):16)/1000); frame._l=ms;
  if(play){tcur+=dt*speed; if(tcur>TT)tcur=0;}
  const f=idxAtT(tcur), ci=Math.round(f)%EP.length;
  const P=atIdx(EP,f), Fw=fwdIdx(EP,f);
  car.position.set(P.x,P.y-0.2,P.z); car.rotation.y=Math.atan2(Fw.x,Fw.z);
  const Pc=atIdx(CA,f), Fc=fwdIdx(CA,f), cf=CAMS[camMode];
  const tgt=new T.Vector3(Pc.x-Fc.x*cf.back, Pc.y+cf.h, Pc.z-Fc.z*cf.back);
  camPrev.lerp(tgt,0.1); cam.position.copy(camPrev);
  cam.lookAt(P.x+Fc.x*cf.ahead, P.y+cf.lookH, P.z+Fc.z*cf.ahead);
  const vv=EV[ci]|0,th=ETH[ci]|0,br=EBR[ci]|0;
  clk.textContent=fmt(tcur); spd.textContent=vv; thrI.style.width=th+'%'; brkI.style.width=br+'%'; thrv.textContent=th+'%'; brkv.textContent=br+'%';
  pct.textContent=Math.round(tcur/TT*100)+'%'; if(!scrub._drag)scrub.value=Math.round(tcur/TT*1000);
  drawMini(ci); renderer.render(scene,cam);
}
requestAnimationFrame(frame);

document.getElementById('play').onclick=function(){play=!play;this.textContent=play?'⏸ 暫停':'▶ 播放';};
document.getElementById('speed').onclick=function(){speed=speed===1?2:(speed===2?0.5:1);this.textContent=speed+'x';};
scrub.addEventListener('input',e=>{scrub._drag=true;tcur=e.target.value/1000*TT;});
scrub.addEventListener('change',()=>{scrub._drag=false;});
document.querySelectorAll('#cams [data-cam]').forEach(b=>b.onclick=()=>{camMode=b.dataset.cam;document.querySelectorAll('#cams [data-cam]').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
document.getElementById('ideal').onclick=function(){idMesh.visible=!idMesh.visible;this.classList.toggle('on',idMesh.visible);};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
})();
</script>
</body>
